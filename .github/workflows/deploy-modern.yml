name: Deploy Modern Portfolio

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Verify Files
      run: |
        echo "✅ Verifying portfolio files"
        test -f index.html && echo "✅ index.html exists"
        test -f css/modern-style.css && echo "✅ CSS exists"
        test -f js/modern-script.js && echo "✅ JS exists"
        test -d images && echo "✅ Images directory exists"

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./
        publish_branch: gh-pages
        force_orphan: true
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'
        commit_message: 'Deploy portfolio ${{ github.sha }}'

    - name: Success
      run: echo "🚀 Portfolio deployed to https://m-elkhou.github.io"