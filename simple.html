<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohammed EL-KHOU - Data Engineer & Cloud Architect</title>
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --text-primary: #ffffff;
            --accent-primary: #00d4ff;
            --accent-gradient: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hero {
            text-align: center;
        }
        .hero h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hero p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }
        .btn {
            display: inline-block;
            padding: 1rem 2rem;
            background: var(--accent-gradient);
            color: white;
            text-decoration: none;
            border-radius: 0.5rem;
            margin: 0.5rem;
            transition: transform 0.3s ease;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="hero">
            <h1>Mohammed EL-KHOU</h1>
            <p>Expert Data Engineer & Cloud Architect</p>
            <p>Specializing in AWS, Big Data, ETL Pipelines, and Data Warehouse Architecture</p>
            <a href="mailto:m.elkhou@hotmail.com" class="btn">Contact Me</a>
            <a href="https://github.com/m-elkhou" class="btn" target="_blank">GitHub</a>
            <a href="https://www.linkedin.com/in/m-elkhou/" class="btn" target="_blank">LinkedIn</a>
        </div>
    </div>
</body>
</html>
